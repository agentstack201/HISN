name: Set up Supabase and redeploy Vercel

# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (sbp_...) and VERCEL_TOKEN.
# Uses the Supabase project the token can reach (or project_ref), restores it if paused,
# creates the tables if missing, turns off email confirmation and wires it into Vercel.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (optional; defaults to the first project the token can see)"
        required: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: hisn
      SITE_URL: https://hisn-delta.vercel.app
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Add the VERCEL_TOKEN repository secret"; exit 1; }

      - name: Prepare API helpers
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          set -euo pipefail
          # call <label> <curl args...>: prints the body, or fails showing the API's own error message.
          call() {
            local label=$1; shift
            local out code body
            out=$(curl -sS -A "hisn-setup/1.0" -w $'\n%{http_code}' "$@") || { echo "::error::$label: network error" >&2; return 1; }
            code=${out##*$'\n'}; body=${out%$'\n'*}
            if [ "$code" -ge 300 ]; then echo "::error::$label failed (HTTP $code): ${body:0:600}" >&2; return 1; fi
            printf '%s' "$body"
          }
          sb() { local label=$1; shift; call "Supabase: $label" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "$@"; }
          vc() { local label=$1; shift; call "Vercel: $label" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          EOF

      - name: Find the Vercel project
        run: |
          . "$RUNNER_TEMP/lib.sh"
          teams=$(vc "list teams" https://api.vercel.com/v2/teams | jq -r '.teams[]?.id')
          for team in "" $teams; do
            param=""; [ -n "$team" ] && param="teamId=$team"
            code=$(curl -sS -A "hisn-setup/1.0" -o "$RUNNER_TEMP/project.json" -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT${param:+?$param}")
            if [ "$code" = "200" ]; then
              echo "Found Vercel project $VERCEL_PROJECT ${team:+in team $team}"
              echo "VERCEL_TEAM_PARAM=$param" >> "$GITHUB_ENV"
              echo "VERCEL_PROJECT_ID=$(jq -r '.id' "$RUNNER_TEMP/project.json")" >> "$GITHUB_ENV"
              echo "VERCEL_ORG_ID=$(jq -r '.accountId' "$RUNNER_TEMP/project.json")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::This Vercel token cannot see a project named '$VERCEL_PROJECT'. Create the token from the Vercel account that owns hisn-delta.vercel.app."
          exit 1

      - name: Pick the Supabase project
        env:
          INPUT_REF: ${{ inputs.project_ref }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            projects=$(sb "list projects" https://api.supabase.com/v1/projects)
            echo "Projects this token can use: $(echo "$projects" | jq -r '[.[].name] | join(", ")')"
            ref=$(echo "$projects" | jq -r '.[0].id // empty')
          fi
          [ -n "$ref" ] || { echo "::error::This Supabase token cannot see any project."; exit 1; }
          echo "Using project $ref"
          echo "REF=$ref" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"

      - name: Restore the project if it is paused
        run: |
          . "$RUNNER_TEMP/lib.sh"
          status=$(sb "project status" "https://api.supabase.com/v1/projects/$REF" | jq -r '.status')
          echo "status: $status"
          if [ "$status" = "INACTIVE" ] || [ "$status" = "PAUSED" ]; then
            sb "restore project" -X POST "https://api.supabase.com/v1/projects/$REF/restore" > /dev/null
            echo "Restore requested"
          fi

      - name: Wait until the project is healthy
        run: |
          . "$RUNNER_TEMP/lib.sh"
          for i in $(seq 1 60); do
            status=$(sb "project status" "https://api.supabase.com/v1/projects/$REF" | jq -r '.status')
            echo "status: $status"
            [ "$status" = "ACTIVE_HEALTHY" ] && exit 0
            sleep 10
          done
          echo "::error::The project did not become healthy in 10 minutes"; exit 1

      - name: Create the tables
        run: |
          . "$RUNNER_TEMP/lib.sh"
          existing=""
          for i in $(seq 1 12); do
            if existing=$(sb "check tables (attempt $i)" -X POST -d '{"query":"select to_regclass('"'"'public.targets'"'"') is not null as present"}' \
              "https://api.supabase.com/v1/projects/$REF/database/query" | jq -r '.[0].present'); then break; fi
            sleep 15
          done
          if [ "$existing" = "true" ]; then echo "Tables already exist, keeping them"; exit 0; fi
          jq -n --rawfile q supabase/migrations/20261020000000_initial_schema.sql '{query:$q}' > "$RUNNER_TEMP/q.json"
          for i in $(seq 1 12); do
            if sb "apply schema (attempt $i)" -X POST -d @"$RUNNER_TEMP/q.json" "https://api.supabase.com/v1/projects/$REF/database/query" > /dev/null; then
              echo "Schema applied"; exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Turn off email confirmation
        run: |
          . "$RUNNER_TEMP/lib.sh"
          sb "auth settings" -X PATCH -d "$(jq -n --arg u "$SITE_URL" '{mailer_autoconfirm:true, site_url:$u}')" \
            "https://api.supabase.com/v1/projects/$REF/config/auth" > /dev/null
          auto=$(sb "read auth settings" "https://api.supabase.com/v1/projects/$REF/config/auth" | jq -r '.mailer_autoconfirm')
          echo "mailer_autoconfirm is now: $auto"
          [ "$auto" = "true" ] || { echo "::error::Supabase did not keep the setting"; exit 1; }

      - name: Read the project keys
        run: |
          . "$RUNNER_TEMP/lib.sh"
          keys=$(sb "read keys" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true")
          anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          service=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$service"
          [ -n "$anon" ] && [ -n "$service" ] || { echo "::error::Could not read the project keys"; exit 1; }
          echo "ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "SERVICE_KEY=$service" >> "$GITHUB_ENV"

      - name: Test a sign-up with a made-up email
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # Auth restarts after a settings change, so give it up to a minute.
          for i in $(seq 1 7); do
            email="hisn-check-$(openssl rand -hex 4)@gmail.com"
            res=$(call "Supabase: test sign-up" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              -d "$(jq -n --arg e "$email" '{email:$e, password:"CheckPass-12345"}')" "$SUPABASE_URL/auth/v1/signup" || true)
            token=$(echo "$res" | jq -r '.access_token // empty' 2>/dev/null || true)
            uid=$(echo "$res" | jq -r '.user.id // .id // empty' 2>/dev/null || true)
            if [ -n "$uid" ]; then
              curl -sS -A "hisn-setup/1.0" -X DELETE -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                "$SUPABASE_URL/auth/v1/admin/users/$uid" > /dev/null || true
            fi
            if [ -n "$token" ]; then echo "Sign-up works without email confirmation"; exit 0; fi
            echo "Attempt $i: no session yet. Reply: $(echo "$res" | jq -c 'del(.access_token, .refresh_token) | {confirmed_at, email_confirmed_at, msg, error_code}' 2>/dev/null || echo "$res" | head -c 300)"
            sleep 10
          done
          echo "::error::Sign-up still needs email confirmation"; exit 1

      - name: Save the keys in Vercel
        run: |
          . "$RUNNER_TEMP/lib.sh"
          put() {
            vc "save $1" -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true${VERCEL_TEAM_PARAM:+&$VERCEL_TEAM_PARAM}" \
              -d "$(jq -n --arg k "$1" --arg val "$2" --arg t "$3" '{key:$k, value:$val, type:$t, target:["production","preview"]}')" > /dev/null
            echo "Saved $1"
          }
          put NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL" plain
          put NEXT_PUBLIC_SUPABASE_ANON_KEY "$ANON_KEY" plain
          put SUPABASE_SECRET_KEY "$SERVICE_KEY" sensitive

      - name: Redeploy the site to production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Check the live sign-up page
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/register")
          echo "$SITE_URL/register answered $code"
          [ "$code" = "200" ]
          echo "Done. New database: $SUPABASE_URL"
